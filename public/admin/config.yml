# Sveltia CMS configuration (Decap-compatible). Served at /admin.
# Publishing commits straight to `main` on GitHub, which redeploys the live site (~1 min).
# Field names must match src/content.config.ts.

backend:
  name: github
  repo: 1yu2/fishplatform
  branch: main
  commit_messages:
    create: 'Add {{collection}}: {{slug}}'
    update: 'Update {{collection}}: {{slug}}'
    delete: 'Delete {{collection}}: {{slug}}'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

site_url: https://fishplatform.vercel.app
display_url: https://fishplatform.vercel.app

# default location for files not tied to one entry; posts and projects keep their images in their own folder
media_folder: public/uploads
public_folder: /uploads

collections:
  # ---------------------------------------------------------------- blog
  - name: blog
    label: Posts
    label_singular: Post
    folder: src/content/blog
    path: '{{slug}}/index'          # one folder per post
    media_folder: ''                # images are saved next to the post
    public_folder: ''
    create: true
    slug: '{{fields.slug}}'
    summary: '{{title}} · {{lang}} · {{date}}{{draft | ternary(" · draft", "")}}'
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: 中文, field: lang, pattern: zh }
      - { label: English, field: lang, pattern: en }
      - { label: 日本語, field: lang, pattern: ja }
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: 'Used for the URL and folder name, e.g. my-first-post. Lowercase letters, numbers and dashes.'
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'lowercase letters, numbers and dashes only']
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - label: Language
        name: lang
        widget: select
        default: zh
        options:
          - { label: 中文, value: zh }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
      - { label: Summary, name: summary, widget: text, hint: 'One or two sentences shown in the post list.' }
      - { label: Tags, name: tags, widget: list, required: false, hint: 'Comma-separated.' }
      - label: Related garden items
        name: related
        widget: relation
        collection: garden
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: 'Which tasks / repos / links this post is about. They link to each other on the site.'
      - { label: Draft, name: draft, widget: boolean, default: false, hint: 'Drafts are not published.' }
      - { label: Original URL, name: canonical, widget: string, required: false, hint: 'Only for posts moved here from another platform.' }
      - { label: Translation key, name: translationKey, widget: string, required: false, hint: 'Give translations of the same post the same key.' }
      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------- garden
  - name: garden
    label: Garden
    label_singular: Garden item
    folder: src/content/garden
    extension: md
    format: frontmatter
    create: true
    slug: '{{fields.slug}}'
    summary: '{{title}} · {{status}} · P{{priority}}'
    sortable_fields: [priority, title, status]
    view_filters:
      - { label: Growing, field: status, pattern: doing }
      - { label: Up next, field: status, pattern: todo }
      - { label: Bloomed, field: status, pattern: done }
      - { label: Repos, field: type, pattern: repo }
    fields:
      - { label: Title, name: title, widget: string }
      - label: ID
        name: slug
        widget: string
        hint: 'File name and URL, e.g. learn-rust. Lowercase letters, numbers and dashes. Do not change it later: posts link to it.'
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'lowercase letters, numbers and dashes only']
      - label: Type
        name: type
        widget: select
        default: task
        options:
          - { label: Task, value: task }
          - { label: GitHub repo, value: repo }
          - { label: Link, value: link }
      - { label: GitHub repo (owner/name), name: repo, widget: string, required: false, pattern: ['^[\w.-]+/[\w.-]+$', 'use owner/name, e.g. mrdoob/three.js'], hint: 'For repos: stars, description and language are filled in automatically.' }
      - { label: URL, name: url, widget: string, required: false, hint: 'For links.' }
      - label: Priority
        name: priority
        widget: select
        default: 2
        options:
          - { label: '1 · High', value: 1 }
          - { label: '2 · Medium', value: 2 }
          - { label: '3 · Low', value: 3 }
      - label: Status
        name: status
        widget: select
        default: todo
        options:
          - { label: Up next, value: todo }
          - { label: Growing (doing), value: doing }
          - { label: Bloomed (done), value: done }
      - { label: Started, name: started, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
      - { label: Due, name: due, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
      - { label: Finished, name: done, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: 'Required when the status is Bloomed. Finished items stay on the homepage for 7 days.' }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: Project
        name: project
        widget: relation
        collection: projects
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: 'One of your own projects this belongs to.'
      - label: Titles in other languages
        name: titles
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: English, name: en, widget: string, required: false }
          - { label: 日本語, name: ja, widget: string, required: false }
          - { label: 中文, name: zh, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Notes, name: body, widget: markdown, required: false, hint: 'Why you saved it / what you want to get out of it.' }

  # ---------------------------------------------------------------- projects
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{fields.slug}}'
    summary: '{{title}} · {{status}} · {{lang}}'
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: 'Used for the URL and folder name. Lowercase letters, numbers and dashes.'
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'lowercase letters, numbers and dashes only']
      - { label: Summary, name: summary, widget: text }
      - label: Status
        name: status
        widget: select
        default: building
        options:
          - { label: Building, value: building }
          - { label: Shipped, value: shipped }
          - { label: Paused, value: paused }
      - { label: Stack, name: stack, widget: list, required: false }
      - { label: Repository URL, name: repo, widget: string, required: false }
      - { label: Demo URL, name: demo, widget: string, required: false }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - label: Language
        name: lang
        widget: select
        default: zh
        options:
          - { label: 中文, value: zh }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Translation key, name: translationKey, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
